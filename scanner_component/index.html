<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:system-ui,Arial,sans-serif}
#codigo{box-sizing:border-box;display:block;width:100%;height:46px;border:2px solid #d5e1f1;border-radius:13px;background:white;color:#102b50;text-align:center;font-size:19px;outline:none}
#codigo:focus{border-color:#0759c9;box-shadow:0 0 0 2px rgba(7,89,201,.13)}</style></head><body>
<input id="codigo" type="text" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Escanea o escribe el código" aria-label="Código de barras">
<script>
(function(){
 const field=document.getElementById('codigo');
 const send=(type,other={})=>window.parent.postMessage({isStreamlitMessage:true,type,...other},'*');
 send('streamlit:componentReady',{apiVersion:1});
 send('streamlit:setFrameHeight',{height:52});
 function focusScanner(){
   try {field.focus({preventScroll:true});}catch(e){field.focus();}
 }
 // Cada vez que vuelve la pantalla inicial Streamlit crea un componente nuevo.
 // El input recibe autofocus y varios intentos tras su montaje.
 [0,50,150,350,750,1400,2400].forEach(t=>setTimeout(focusScanner,t));
 window.addEventListener('message',e=>{
   if(e.data && e.data.type==='streamlit:render')
     send('streamlit:setFrameHeight',{height:52});
 });
 field.addEventListener('keydown',e=>{
   if(e.key!=='Enter' && e.key!=='NumpadEnter')return;
   e.preventDefault();
   const codigo=field.value.trim();
   if(!codigo)return;
   field.value='';
   send('streamlit:setComponentValue',{value:{codigo,id:String(Date.now())+'-'+Math.random().toString(36).slice(2)}});
 });
})();
</script></body></html>
