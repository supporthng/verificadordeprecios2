<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;font-family:system-ui,Arial,sans-serif}
input{box-sizing:border-box;width:100%;height:48px;padding:4px 12px;border:2px solid #d5e1f1;border-radius:14px;background:white;text-align:center;font-size:21px;color:#102b50}
input:focus{outline:none;border-color:#16823c;box-shadow:0 0 0 3px #d9f5df}
</style></head><body>
<input id="codigo" type="text" placeholder="Escanea o escribe el código" autocomplete="off" autofocus aria-label="Código de barras" />
<script>
const campo=document.getElementById('codigo');
let contador=0;
function enviar(tipo,datos={}){window.parent.postMessage({isStreamlitMessage:true,type,...datos},'*')}
function enfocar(){
  if (campo.disabled || document.activeElement === campo) return;
  try { window.focus(); campo.focus({preventScroll:true}); } catch(e) {}
}
// Streamlit puede actualizar el fragmento y quitar el foco DESPUES del render.
// Recuperarlo mientras el lector esta disponible, no solo al cargar el iframe.
const recuperarFoco = setInterval(enfocar, 450);
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(enfocar, 80); });
window.addEventListener('message',event=>{if(event.data && event.data.type==='streamlit:render'){enviar('streamlit:setFrameHeight',{height:52});enfocar()}});
window.addEventListener('focus',enfocar);
window.addEventListener('pageshow',()=>setTimeout(enfocar,100));
requestAnimationFrame(()=>setTimeout(enfocar,150));
setTimeout(enfocar,450);setTimeout(enfocar,900);
campo.addEventListener('keydown',event=>{
 if(event.key==='Enter'){
  event.preventDefault();const codigo=campo.value.trim();if(!codigo)return;
  campo.disabled=true;clearInterval(recuperarFoco);
  enviar('streamlit:setComponentValue',{value:{codigo,id:String(Date.now())+'-'+String(++contador)},dataType:'json'});
 }
});
enviar('streamlit:componentReady',{apiVersion:1});
enviar('streamlit:setFrameHeight',{height:52});
</script></body></html>
